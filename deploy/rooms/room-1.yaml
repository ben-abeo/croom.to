# Crystal Meet room device: Room 1
# Replace the three REPLACE values (the location is optional), then install with:
#   sudo bash installer/install.sh --config room-1.yaml --credentials google-service-account.json --zoom-credentials zoom-credentials.json
version: 2

room:
  name: "Room 1"
  # What people call the place, e.g. "2nd floor, by the kitchen". Leave the placeholder or delete the line to show the room's name alone.
  location: "REPLACE_WITH_LOCATION"
  timezone: "America/Chicago"

meeting:
  platforms: [zoom, google_meet]
  default_platform: auto
  join_early_minutes: 1
  auto_leave: true
  camera_default_on: true
  mic_default_on: true
  zoom_credentials_path: /etc/croom/zoom-credentials.json
  google_profile_dir: /var/lib/croom/meet-profile

calendar:
  providers: [google]
  google_credentials_path: /etc/croom/google-service-account.json
  google_calendar_id: "REPLACE_WITH_ROOM_CALENDAR_ID"
  sync_interval_seconds: 60

ai:
  enabled: false

control:
  enabled: true
  host: "0.0.0.0"
  port: 8080

# The room's LG TV, if it has one (the room guide's section The TV). Switched off until you set it up: set enabled to true, take the # off the
# lines under it and put the TV's own address and MAC address in them. Keep this one block: a second tv: in the file would silently win.
tv:
  enabled: false
  # host: "10.0.0.41"           # the TV's address (Options, then TV, then Find TVs on the table lists it)
  # mac: "AA:BB:CC:DD:EE:FF"    # the TV's MAC address, in quotes; the device needs it even if the TV has Quick Start+
  # pi_input: "HDMI_1"          # the TV input the room device is plugged into
  # keep_on: true               # turn the TV on at start and before every join, and keep it on

dashboard:
  enabled: true
  url: "http://REPLACE_WITH_DASHBOARD_ADDRESS:3001"
  enrollment_token: "REPLACE_WITH_TOKEN_FROM_DASHBOARD"
  heartbeat_interval_seconds: 30
  metrics_interval_seconds: 60
