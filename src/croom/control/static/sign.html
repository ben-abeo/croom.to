<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Meet</title>
<link rel="icon" href="/static/crystalpm-logo-white.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/sign.css">
</head>
<body data-state="loading" data-bg="skyline" data-view="today">
<main class="sign">
  <div class="backdrop" aria-hidden="true">
    <div class="glow"></div>
  </div>
  <div class="rail"></div>

  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/crystalpm-logo-white.svg" alt="Crystal PM">
      <span id="company" class="company"></span>
    </div>
    <div class="when">
      <p id="clock" class="clock"></p>
      <p id="date" class="date"></p>
    </div>
  </header>

  <section class="main">
    <div class="status">
      <h1 id="room-name" class="room"></h1>
      <p id="room-location" class="location" hidden></p>
      <div aria-live="polite">
        <div class="chip"><span class="dot"></span><span id="chip-text">Connecting</span></div>
        <p id="detail" class="detail"></p>
      </div>
      <div id="sign-actions" class="sign-actions" hidden></div>
    </div>

    <div id="today" class="today" hidden>
      <div class="today-head">
        <h2>Today</h2>
        <button id="this-week" class="button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>This week</button>
      </div>
      <ul id="events" class="events"></ul>
      <p id="calendar-note" class="note"></p>
    </div>

    <section id="week" class="week" aria-labelledby="week-title" hidden>
      <div class="week-head">
        <h2 id="week-title">This week</h2>
        <button id="week-back" class="button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
      </div>
      <ol id="week-days" class="days"></ol>
      <p id="week-note" class="note"></p>
    </section>

    <section id="booking" class="booking" aria-live="polite" hidden></section>
  </section>

  <footer id="score" class="score" hidden>
    <span id="score-last" class="last"></span>
    <span id="score-next" class="next"></span>
  </footer>
</main>
<script src="/static/booking.js"></script>
<script src="/static/sign.js"></script>
</body>
</html>
